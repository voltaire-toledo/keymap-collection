name: Validate site links

on:
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/site-check-links.yml"

  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/site-check-links.yml"

  schedule:
    - cron: "30 6 * * 1"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-links:
    name: Check site links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check local and external links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --verbose
            --no-progress
            --exclude-mail
            --exclude '^https://fonts\.googleapis\.com/'
            --exclude '^https://fonts\.gstatic\.com/'
            './docs/**/*.html'
          fail: true
